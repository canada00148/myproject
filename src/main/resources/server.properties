# TCP Anti-Attack Server Configuration

# CC Protection Settings
cc.protection.enabled=true
cc.max.connections.per.ip=10
cc.max.connections.per.second=5
cc.ban.duration.seconds=300

# Packet Validation Settings
packet.validation.enabled=true
packet.max.size=65536
packet.min.size=1
packet.drop.invalid=true

# Server Performance Settings
server.worker.threads=16
server.read.timeout.seconds=30
server.write.timeout.seconds=30

# Rate Limiting Settings
ratelimit.global.per.second=1000.0
ratelimit.per.ip.per.second=100.0