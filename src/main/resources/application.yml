server:
  port: 8080

spring:
  application:
    name: anti-attack-system
  
  # Redis配置（可選，用於分佈式限流）
  redis:
    host: localhost
    port: 6379
    password: 
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

# 安全配置
security:
  # CC攻擊防護配置
  cc:
    enabled: true
    max-requests-per-minute: 60
    max-requests-per-second: 10
  
  # 封包驗證配置
  packet-validation:
    enabled: true
    block-on-error: true

# 日誌配置
logging:
  level:
    root: INFO
    com.security.antiattack: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/anti-attack.log
    max-size: 10MB
    max-history: 30